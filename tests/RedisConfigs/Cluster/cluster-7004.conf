port 7004
cluster-enabled yes
dir "../Temp"
cluster-config-file "../Cluster/nodes-7004.conf"
cluster-node-timeout 5000
appendonly yes
dbfilename "dump-7004.rdb"
appendfilename "appendonly-7004.aof"
save ""
notify-keyspace-events AKE
# the test cluster bus is plaintext and reachable only from the docker network / local host
cluster-bus-port-protected-mode no
