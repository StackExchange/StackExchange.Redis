port 7005
cluster-enabled yes
dir "../Temp"
cluster-config-file "../Cluster/nodes-7005.conf"
cluster-node-timeout 5000
appendonly yes
dbfilename "dump-7005.rdb"
appendfilename "appendonly-7005.aof"
save ""
notify-keyspace-events AKE

# 8.12 adds cluster-bus-port-protected-mode (default on), which refuses to start a cluster node
# without TLS on the bus; this test topology is plaintext. Servers before 8.12 abort on the unknown
# directive, so this line can only exist alongside the 8.12 image bump on this branch.
cluster-bus-port-protected-mode no
